<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxService — Dashboard</title>
    <link rel="stylesheet" href="css/Main.css" />
  </head>
  <body data-page="dashboard">
    <div class="app-wrapper">
      <div id="sidebar-container"></div>

      <div class="main-content">
        <div class="container">
          <div class="page-header">
            <div>
              <p class="page-eyebrow">BoxService</p>
              <h1 class="page-title">Dashboard</h1>
            </div>
          </div>

          <div id="alert-box" class="alert"></div>

          <!-- Estado del sistema -->
          <div class="stat-grid mb-6">
            <div class="stat-card">
              <p class="stat-label">Servidor</p>
              <p class="stat-value" id="status-server">—</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">Base de datos</p>
              <p class="stat-value" id="status-db">—</p>
            </div>
            <div class="stat-card">
              <p class="stat-label">Versión</p>
              <p class="stat-value" id="status-version">—</p>
            </div>
          </div>

          <!-- Accesos rápidos -->
          <div class="card">
            <p class="card-title">Accesos rápidos</p>
            <div class="flex flex-wrap gap-3">
              <a href="pages/clientes.html" class="btn btn-secondary"
                >👤 Clientes</a
              >
              <a href="pages/vehiculos.html" class="btn btn-secondary"
                >🚗 Vehículos</a
              >
              <a href="pages/services.html" class="btn btn-secondary"
                >🔧 Services</a
              >
              <a href="pages/presupuestos.html" class="btn btn-primary"
                >📋 Nuevo presupuesto</a
              >
              <a href="pages/facturas.html" class="btn btn-secondary"
                >🧾 Facturas</a
              >
            </div>
          </div>
        </div>
        <div id="footer-container"></div>
      </div>
    </div>

    <script type="module" src="js/components.js"></script>
    <script type="module">
      import { getHealth } from "./js/api.js";
      async function checkHealth() {
        const res = await getHealth();
        if (res.success) {
          const srv = document.getElementById("status-server");
          const db = document.getElementById("status-db");
          const ver = document.getElementById("status-version");
          srv.textContent = res.data.status;
          srv.classList.add("success");
          db.textContent = res.data.database;
          db.classList.add(
            res.data.database === "connected" ? "success" : "danger",
          );
          ver.textContent = res.data.version;
        }
      }
      document.addEventListener("DOMContentLoaded", checkHealth);
    </script>
  </body>
</html>
