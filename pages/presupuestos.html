<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxService — Presupuestos</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/budget.css" />
  </head>
  <body data-page="presupuestos">
    <div class="app-wrapper">
      <div id="sidebar-container"></div>

      <div class="main-content">
        <div class="container">
          <div class="page-header-actions mb-6">
            <h1 class="page-title" style="margin: 0">Presupuestos</h1>
            <a href="taller.html" class="btn btn-primary btn-sm">+ Nuevo (en Taller)</a>
          </div>
          <p class="text-muted mb-6">
            Panel de gestión: aprobá o rechazá desde acá. Para crear un presupuesto nuevo o
            generar el service de uno aprobado, andá al Taller y elegí el vehículo.
          </p>

          <div id="alert-box" class="alert"></div>

          <!-- Listado -->
          <div class="card">
            <p class="card-title">Listado</p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Número</th>
                    <th>Fecha</th>
                    <th>Vehículo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="table-body">
                  <tr>
                    <td colspan="5" class="text-muted">Cargando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div id="footer-container"></div>
      </div>
    </div>

    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/budget.js"></script>
  </body>
</html>
