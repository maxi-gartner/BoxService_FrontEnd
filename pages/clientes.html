<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxService — Clientes</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/clientes.css" />
  </head>
  <body data-page="clientes">
    <div class="app-wrapper">
      <div id="sidebar-container"></div>

      <div class="main-content">
        <div class="container">
          <h1 class="page-title">Clientes</h1>

          <div id="alert-box" class="alert"></div>

          <div class="clientes-layout">
            <!-- Formulario -->
            <div class="card mb-6">
              <p class="card-title">Nuevo cliente</p>
              <form id="cliente-form">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input
                      class="form-control"
                      type="text"
                      name="nombre"
                      placeholder="Juan Pérez"
                      required
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input
                      class="form-control"
                      type="text"
                      name="telefono"
                      placeholder="3431234567"
                    />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input
                    class="form-control"
                    type="email"
                    name="email"
                    placeholder="juan@email.com"
                  />
                </div>
                <div class="flex-between mt-4">
                  <span></span>
                  <button class="btn btn-primary" type="submit">
                    Guardar cliente
                  </button>
                </div>
              </form>
            </div>

            <!-- Listado -->
            <div class="card mb-6">
              <div class="flex-between mb-4">
                <p class="card-title" style="margin: 0">Clientes activos</p>
                <button id="refresh-clientes" class="btn btn-secondary btn-sm">
                  Actualizar
                </button>
              </div>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Teléfono</th>
                      <th>Email</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="clientes-tbody">
                    <tr>
                      <td colspan="5" class="text-muted">Cargando...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Vehículos del cliente -->
          <div class="card">
            <p class="card-title">Vehículos del cliente</p>
            <p id="vehiculos-subtitle" class="text-muted mb-4">
              Seleccioná un cliente para ver sus vehículos.
            </p>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Patente</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Año</th>
                    <th>Kilometraje</th>
                  </tr>
                </thead>
                <tbody id="vehiculos-tbody">
                  <tr>
                    <td colspan="6" class="text-muted">
                      Todavía no hay datos para mostrar.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div id="footer-container"></div>
      </div>
    </div>

    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/clientes.js"></script>
  </body>
</html>
