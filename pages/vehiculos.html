<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxService — Vehículos</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/vehicle.css" />
  </head>
  <body data-page="vehiculos">
    <div class="app-wrapper">
      <div id="sidebar-container"></div>

      <div class="main-content">
        <div class="container">

          <div class="page-header">
            <div>
              <p class="page-eyebrow">Gestión</p>
              <h1 class="page-title">Vehículos</h1>
            </div>
          </div>

          <div id="page-alert" class="alert"></div>

          <div class="vehiculos-grid">

            <!-- Registrar -->
            <div class="card">
              <p class="card-title">Registrar vehículo</p>
              <form id="vehiculo-form">
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="patente">Patente</label>
                    <input class="form-control" type="text" id="patente" name="patente" placeholder="ABC123" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="marca">Marca</label>
                    <input class="form-control" type="text" id="marca" name="marca" placeholder="Toyota" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label class="form-label" for="modelo">Modelo</label>
                    <input class="form-control" type="text" id="modelo" name="modelo" placeholder="Corolla" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="anio">Año</label>
                    <input class="form-control" type="number" id="anio" name="anio" placeholder="2022" min="1900" max="2100" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="cliente">ID Cliente</label>
                  <input class="form-control" type="number" id="cliente" name="cliente" placeholder="ID del cliente" required />
                </div>
                <div class="vehiculos-actions">
                  <button class="btn btn-primary" type="submit">Guardar vehículo</button>
                </div>
              </form>
            </div>

            <!-- Listado -->
            <div class="card">
              <p class="card-title">Lista de vehículos</p>
              <div class="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>Patente</th>
                      <th>Marca</th>
                      <th>Modelo</th>
                      <th>Año</th>
                      <th>Cliente ID</th>
                      <th>Km</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="vehiculos-body">
                    <tr><td colspan="7" class="empty-state">Cargando...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
        <div id="footer-container"></div>
      </div>
    </div>

    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/vehiculos.js"></script>
  </body>
</html>
