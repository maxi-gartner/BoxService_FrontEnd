name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      # npm ci (no npm install) exige que el lockfile describa exactamente
      # la misma resolución que reconstruiría desde cero — y eso se rompe
      # con @hookform/resolvers/ajv, un peer opcional que el proyecto ni
      # usa (solo se usa @hookform/resolvers/zod) pero que entra en
      # conflicto de versión con el ajv interno de ESLint. npm install lo
      # tolera sin problema — es literalmente lo que ya usa Vercel para
      # el deploy real, así que este paso queda consistente con eso.
      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit

      # Sin BACKEND_MODE seteada cae a "mock" (lib/backend-mode.ts) — el
      # build no necesita ningún secreto ni backend real levantado.
      - name: Build
        run: npm run build
