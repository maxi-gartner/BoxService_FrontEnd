<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxService — Ingresar</title>
    <link rel="stylesheet" href="css/main.css" />
    <style>
      body { align-items: center; justify-content: center; }
      .login-shell { width: min(420px, calc(100% - 32px)); }
      .login-brand { margin-bottom: var(--space-6); text-align: center; }
      .login-brand .sidebar-title { font-size: var(--text-2xl); }
      .login-error { min-height: 24px; color: var(--color-danger); font-size: var(--text-sm); margin-top: var(--space-3); }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="login-brand"><span class="sidebar-icon">⚙</span> <span class="sidebar-title">BoxService</span></div>
      <section class="card">
        <h1 class="card-title">Ingresar</h1>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p id="login-error" class="login-error" role="alert"></p>
          <button class="btn btn-primary" type="submit">Ingresar</button>
        </form>
      </section>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
